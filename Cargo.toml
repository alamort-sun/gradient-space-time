[workspace]
members = [
    "crates/spacetime-module",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["Evelynn Hudson <evelynn.h22@gmail.com>"]
repository = "https://github.com/alamort-sun/gradient-space-time"
description = "Durable trajectory persistence and replay for codec-valid Vector15D states via SpacetimeDB"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
spacetimedb = "1.0"
thiserror = "1.0"
tracing = "0.1"
# Single source of truth for the canonical Vector15D / DomainWall / GaugeCoupling.
# Every core (jelle, space-time) must reference the codec's types — never a local copy.
vecGradient = { path = "../gradient-codec/vecGradient" }
# Saraswati A2 plane-safe newtypes (LeaseId, ActDigest, …).
gradient-plane = { path = "../gradient-codec/plane", features = ["spacetimedb"] }
sha2 = "0.10"
